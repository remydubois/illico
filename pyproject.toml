[project]
name = "illico"
version = "0.6.0rc2"
description = "Fast asymptotic mannwhitney-u test"
authors = [
    {name = "remydubois",email = "remydubois14@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "anndata (>=0.11)",
    "numba (>=0.60)",
    "pandas (>=2.2.2)",
    "scipy (>=1.13,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "dask (>=2026.6.0,<2027.0.0)",
]


# [build-system]
# requires = ["poetry-core>=2.0.0,<3.0.0"]
# build-backend = "poetry.core.masonry.api"
[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "illico.rust_backend"

[dependency-groups]
dev = [
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-benchmark (>=5.1.0,<6.0.0)",
    "pytest-benchmark[histogram] (>=5.2.3,<6.0.0)",
    "pre-commit (>=4.3.0,<5.0.0)",
    "scanpy (>=1.11.5,<2.0.0)",
    "pytest-memray (>=1.8.0,<2.0.0)",
    "memory-profiler (>=0.61.0,<0.62.0)",
    "pytest-regex (>=0.2.0,<0.3.0)",
    "memray (>=1.19.1,<2.0.0)",
    "pdex (>=0.2.0)",
    "ipdb (>=0.13.13,<0.14.0)",
    "tomli (>=2.4.1,<3.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "maturin (>=1.13.3,<2.0.0)",
]
doc = [
    "Sphinx>=5.0",
    "furo",
    "myst-parser (>=5.0.0,<6.0.0)",
]

[tool.black]
line-length = 120

[tool.docformatter]
recursive = true
wrap-summaries = 120
wrap-descriptions = 120
force-wrap = false
blank = true

[tool.isort]
profile = "black"

[tool.ruff]
extend-exclude = ["tests", "notebooks"]

[tool.pytest.ini_options]
markers = [
    "speed_bench: slow speed benchmarks tests",
    "memory_bench: slow memory benchmarks tests",
]
addopts = "-p no:warnings"
