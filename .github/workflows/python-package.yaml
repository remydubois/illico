name: Python package

on:
  # push:
  #   branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  format-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        components: rustfmt
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install Poetry
      uses: snok/install-poetry@v1
    - name: Install dependencies
      run: |
        make install QUIET=1
    - name: Format check with ruff and cargo
      run: |
        make format check
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        dev-extra: ["dev", "dev-no-dask"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: actions-rust-lang/setup-rust-toolchain@v2
    - name: Install Poetry
      uses: snok/install-poetry@v1
    - name: Install dependencies
      run: |
        poetry env use $(which python)
        make install WITH=${{ matrix.dev-extra }} QUIET=1
    - name: Test with pytest (no tox because matrix already handles python version)
      # env:
      #   ILLICO_DEV_GROUP: ${{ matrix.dev-extra }}
      run: |
        make unit-test
