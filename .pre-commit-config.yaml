repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.1"
    hooks:
    -   id: ruff
        args: [--fix]
    -   id: ruff-format
- repo: local
  hooks:
    - id: cargo-fmt
      name: cargo fmt (rust)
      entry: bash -lc 'rustup component add rustfmt >/dev/null 2>&1 || true; cargo fmt --all'
      language: system
      files: '\.rs$'
      pass_filenames: false
    - id: cargo-check
      name: cargo check (rust)
      entry: bash -lc 'cargo check --all-targets'
      language: system
      files: '\.rs$'
      pass_filenames: false
